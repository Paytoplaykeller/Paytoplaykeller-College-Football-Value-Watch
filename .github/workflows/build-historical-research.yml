name: Build historical pregame research dataset
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pyarrow
      - name: Build from completed 2023-2025 seasons with provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          from cfb_value_watch.public_archive import download_archive
          from cfb_value_watch.pregame_features import build_pregame_snapshots,OBSERVED_FIELDS
          root=Path('research_output');root.mkdir(exist_ok=True)
          schedules=[];plays=[];sources=[]
          pcols=['game_id','pos_team_id','def_pos_team_id','pos_team','def_pos_team','rush','pass','EPA','firstD_by_poss','td_play','sack','int','fumble_vec','yds_rushed','yds_receiving']
          scols=['game_id','fbs_game','completed','home_id','away_id','home_team','away_team','home_points','away_points','start_date','neutral_site']
          for year in (2023,2024,2025):
              sd=download_archive('schedules',year,'/tmp/source_schedule')
              pb=download_archive('pbp',year,'/tmp/source_pbp')
              schedules += pq.read_table(sd['path'],columns=scols).to_pylist()
              plays += pq.read_table(pb['path'],columns=pcols).to_pylist()
              sources.extend([{'year':year,'kind':kind,'sha256':doc['sha256'],'source':doc['source']} for kind,doc in [('schedules',sd),('pbp',pb)]])
          rows=build_pregame_snapshots(schedules,plays)
          viable=[r for r in rows if len(r['features'])==len(OBSERVED_FIELDS)]
          (root/'partial_asof_features.json').write_text(json.dumps(viable))
          report={'count':len(viable),'bet_approved':0,'missing_availability':True,
                  'historical_close_odds_not_training_features':True,'sources':sources}
          (root/'manifest.json').write_text(json.dumps(report,indent=2))
          print('HISTORICAL_RESEARCH_DATASET',report['count'],'records; NOT BET READY')
          assert len(viable) >= 1000, 'Inadequate historical features'
          assert not any(r['bet_now_eligible'] for r in viable)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-pregame-partial-2023-2025
          path: research_output/
          retention-days: 14
