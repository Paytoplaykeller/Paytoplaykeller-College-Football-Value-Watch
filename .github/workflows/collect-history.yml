name: Collect historical FBS games and lines (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Collect historical game and line archives
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "BLOCKED: CFBD_API_KEY is not configured; no fabricated historical data"
            exit 1
          fi
          python -m cfb_value_watch.cfbd_collect --start-year 2018 --end-year 2025 --output data/raw_cfbd
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fbs-raw-2018-2025
          path: data/raw_cfbd/*.json
          retention-days: 30
