name: Validate BET NOW evaluator
on:
  push:
    branches: [feature/evidence-backed-bet-evaluator]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/validate-bet-evaluator.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - name: Missing evidence must fail closed
        run: |
          printf '{}' > /tmp/incomplete.json
          if python -m cfb_value_watch.decision_cli /tmp/incomplete.json; then
            echo 'ERROR: empty evidence approved' >&2
            exit 1
          fi
