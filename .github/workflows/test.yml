name: CFB Engine Tests
on:
  push:
    branches: [main, feature/v5-decision-engine]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install history dependencies
        run: python -m pip install -e . pandas pyarrow
      - name: Download historical FBS seasons and validate
        run: python -m cfb_value_watch.public_history --out data/public_history
      - name: Upload historical dataset and holdout report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-public-history-2018-2025
          path: |
            data/public_history/pregame_features_2018_2025.csv
            data/public_history/validation_report.json
          retention-days: 30

  network-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install network data dependencies
        run: python -m pip install -e . pandas pyarrow
      - name: Run pregame network backtest
        run: python -m cfb_value_watch.network_backtest --out data/network_validation
      - name: Upload predictions and holdout metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-v6-network-2024-2025
          path: |
            data/network_validation/schedule_network_predictions.csv
            data/network_validation/network_validation.json
          retention-days: 30

  network-blend:
    needs: [public-history, network-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pandas
      - uses: actions/download-artifact@v4
        with:
          name: cfb-public-history-2018-2025
          path: data/public_history
      - uses: actions/download-artifact@v4
        with:
          name: cfb-v6-network-2024-2025
          path: data/network_validation
      - name: Freeze 2024 network blend and evaluate 2025
        run: python -m cfb_value_watch.network_blend
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-v6-opponent-network-blend-audit
          path: data/network_validation/v6_blend_validation.json
          retention-days: 30

  kentucky-byu-fsu-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pandas pyarrow
      - name: Freeze Oct 17 2026 pregame replay
        run: python -m cfb_value_watch.replay_oct17 --as-of 2026-10-17T18:00:00-04:00 --out data/replay_2026_10_17.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cfb-v6-kentucky-byu-fsu-frozen-replay
          path: data/replay_2026_10_17.json
          retention-days: 30

  historical-market-audit:
    needs: [network-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install historical data dependencies
        run: python -m pip install -e . pandas pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: cfb-v6-network-2024-2025
          path: data/network_validation
      - name: Compare historical spreads against frozen network forecasts
        run: python -m cfb_value_watch.market_backtest
      - name: Upload full-board holdout results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-market-dislocation-2024-2025
          path: |
            data/market_audit/market_dislocation_holdout.json
            data/market_audit/matched_market_network.csv
          retention-days: 30
