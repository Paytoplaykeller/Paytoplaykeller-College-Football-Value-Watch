name: Hourly read-only FBS market scan
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/evidence-backed-bet-evaluator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Scan public FBS odds (fail closed if feed unavailable)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m cfb_value_watch.market_scan_cli
      - uses: actions/upload-artifact@v4
        with:
          name: hourly-public-fbs-scan
          path: research_output/hourly_public_board.json
          retention-days: 7
